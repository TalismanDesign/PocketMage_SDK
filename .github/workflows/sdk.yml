name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app-template:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout the official app template
        uses: actions/checkout@v4
        with:
          repository: TalismanDesign/PocketMage_App
          path: app-template

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon tooling
        run: pip install --quiet Pillow

      - name: Install Xtensa Toolchain
        run: |
          set -euo pipefail
          VER=esp-15.2.0_20251204
          SHA=3d50f5cd5f173acfd524e07c1cd69bc99585731a415ca2e5bce879997fe602b8
          TGT="$HOME/.espressif/tools/xtensa-esp-elf/$VER"
          URL="https://github.com/espressif/crosstool-NG/releases/download/$VER/xtensa-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz"
          mkdir -p "$TGT"
          curl -fsSL -o /tmp/xtensa-esp-elf.tar.xz "$URL"
          echo "$SHA  /tmp/xtensa-esp-elf.tar.xz" | sha256sum -c -
          tar -xJf /tmp/xtensa-esp-elf.tar.xz -C "$TGT"
          test -x "$TGT/xtensa-esp-elf/bin/xtensa-esp32s3-elf-g++"
          # app.mk falls back to `command -v xtensa-esp32s3-elf-g++`, and the
          # artifact check calls xtensa-esp-elf-readelf by bare name.
          echo "$TGT/xtensa-esp-elf/bin" >> "$GITHUB_PATH"
          echo "toolchain installed at $TGT/xtensa-esp-elf"

      - name: Build and pack the template app against this SDK
        working-directory: app-template
        run: make clean all pack
        env:
          PM_SDK_ROOT: ${{ github.workspace }}

      - name: Assert the app passes the pm gate
        run: |
          set -euo pipefail
          pip install .
          pm check "app-template"

      - name: Assert artifact little-endian and complete
        working-directory: app-template/build
        run: |
          set -euo pipefail
          xtensa-esp-elf-readelf -h app-template.app.elf | grep -q 'little endian'
          test 200 -eq "$(stat -c %s app-template_ICON.bin)"
          tar -tf app-template.tar | grep -q -- 'app-template.app.elf'
          tar -tf app-template.tar | grep -q -- 'app-template_ICON.bin'

      - name: Build and reject the negative fixture
        run: |
          set -euo pipefail
          make -C tools/pm/tests/fixtures/broken_app clean all
          if pm check tools/pm/tests/fixtures/broken_app; then
            echo "broken_app must fail the export gate" >&2
            exit 1
          fi
          echo "broken_app correctly rejected"
        env:
          PM_SDK_ROOT: ${{ github.workspace }}

      - name: Golden artifact, generator and host-table tests
        run: |
          set -euo pipefail
          export PM_READELF="$HOME/.espressif/tools/xtensa-esp-elf/esp-15.2.0_20251204/xtensa-esp-elf/bin/xtensa-esp32s3-elf-readelf"
          python3 -m unittest discover -v -s tools/pm/tests -t tools/pm/tests

  version-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: All version lands read VERSION
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          grep -Eq "pocketmage_sdk_version\[\] = \"$V\"" pocketmage_globals.cpp
          IFS=. read -r VMAJ VMIN VPAT <<< "$V"
          grep -Eq "#define POCKETMAGE_SDK_VERSION_MAJOR $VMAJ([^0-9]|$)" pocketmage_app_version.h
          grep -Eq "#define POCKETMAGE_SDK_VERSION_MINOR $VMIN([^0-9]|$)" pocketmage_app_version.h
          grep -Eq "#define POCKETMAGE_SDK_VERSION_PATCH $VPAT([^0-9]|$)" pocketmage_app_version.h
          ! grep -Eq '^version = ' pyproject.toml
          python3 - "$V" <<'PY'
          import json
          import sys
          version = sys.argv[1]
          assert json.load(open("library.json"))["version"] == version
          PY
          echo "VERSION ($V) matches pocketmage_globals.cpp, pocketmage_app_version.h, library.json, and pyproject"

  i18n-generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate i18n tables from SDK catalogs
        run: |
          set -euo pipefail
          python pocketmage_i18n/tools/gen_i18n.py --force \
            --catalog pocketmage_i18n/languages \
            --out-dir /tmp/pm-sdk-i18n
          test -s /tmp/pm-sdk-i18n/pocketmage_i18n_gen.h
          test -s /tmp/pm-sdk-i18n/pocketmage_i18n_gen.cpp
          echo "tables generated"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff checks the pm toolchain and tests
        run: |
          python -m pip install --quiet ruff
          ruff check tools/

      - name: Gate-scoped sources are clang-formatted
        run: |
          sudo apt-get install -y -qq clang-format
          clang-format --dry-run --Werror \
            pocketmage_globals.cpp \
            pocketmage_app_version.h \
            tools/pm/tests/fixtures/broken_app/main.cpp \
            tools/pm/tests/fixtures/template/main.cpp

  pm-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Prepare the Python Cauldron
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the SDK
        run: pip install .

      - name: pm reports the SDK version
        run: |
          set -euo pipefail
          pm version | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+'
          pm --help | grep -q 'new'

      - name: pm exports and release are reachable
        run: |
          set -euo pipefail
          pm exports --help | grep -q -- '--host'
          pm release --help | grep -qE 'major|minor|patch'

      - name: pm test suite
        run: python3 -m unittest discover -s tools/pm/tests